<!DOCTYPE html>
<html>

<head>
    <title id="title"></title>
    <script type="text/javascript" src="jquery/jquery.min.js"></script>
    <script type="text/javascript" src="options.js"></script>
    <style>
        body {
            padding: 10px;
            font-style: normal;
            font-family: Arial, sans-serif;
        }

        select {
            width: 200px;
        }

        .section {
            font-size: 21px;
            font-weight: normal;
            font-style: normal;
            line-height: 29px;
            margin-top: 25px;
            padding-bottom: 10px;
        }

        .item-wrapper {
            font-size: 18px;
            width: 500px;
            display: block;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .bottom-line {
            border-bottom-width: 1px;
            border-bottom-style: solid;
        }

        .item {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .italic {
            font-style: italic;
        }

        .info-icon {
            position: relative;
            margin-left: 5px;
            vertical-align: middle;
            cursor: pointer;
            font-size: 18px;
            color: #007BFF;
        }

        .info-icon:hover::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
            max-width: 200px;
            white-space: normal;
            z-index: 9999;
            left: 50%;
            transform: translateX(-50%);
        }

        .info-icon:hover::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.7) transparent transparent transparent;
        }

        .info-icon:last-child:hover::before {
            left: auto;
            right: 50%;
            transform: translateX(50%);
        }
    </style>
</head>

<body>
    <table style="margin: 0 0 20px 0;">
        <tbody>
            <tr>
                <td style="padding-right: 8px; vertical-align: middle;">
                    <img src="../icons/48.png" height="48" width="48">
                </td>
                <td>
                    <h1>
                        <span style="font-size: 1.5em; font-weight: bold;" id="header"></span>
                    </h1>
                </td>
            </tr>
        </tbody>
    </table>
    <div>
        <h2 id="translation" class="section"></h2>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <span id="translateBy"></span>
            </div>
            <div class="sub-item">
                <select id="api"></select>
            </div>
        </div>
    </div>
    <div id="lang-from" class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <span id="fromName"></span>
            </div>
            <div class="sub-item">
                <select id="from"></select>
            </div>
        </div>
    </div>
    <div class="item-wrapper">
        <div class="item">
            <div class="sub-item">
                <span id="toName"></span>
            </div>
            <div class="sub-item">
                <select id="to"></select>
            </div>
        </div>
    </div>
    <div>
        <h2 id="popup" class="section"></h2>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <span id="qtipStyleClassName"></span>
            </div>
            <div class="sub-item">
                <select id="qtipStyleClass">
                    <option value="">default</option>
                    <option value="qtip-light">light</option>
                    <option value="qtip-dark">dark</option>
                    <option value="qtip-cream">cream</option>
                    <option value="qtip-red">red</option>
                    <option value="qtip-green">green</option>
                    <option value="qtip-blue">blue</option>
                    <option value="qtip-shadow">shadow</option>
                    <option value="qtip-rounded">rounded</option>
                    <option value="qtip-bootstrap">bootstrap</option>
                    <option value="qtip-tipsy">tipsy</option>
                    <option value="qtip-youtube">youtube</option>
                    <option value="qtip-jtools">jtools</option>
                    <option value="qtip-cluetip">cluetip</option>
                    <option value="qtip-tipped">tipped</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <span id="maxWidthName"></span>
            </div>
            <div class="sub-item">
                <select id="maxWidth">
                    <option value="200px">200px</option>
                    <option value="300px">300px</option>
                    <option value="400px">400px</option>
                    <option value="500px">500px</option>
                    <option value="600px">600px</option>
                    <option value="700px">700px</option>
                    <option value="800px">800px</option>
                    <option value="900px">900px</option>
                    <option value="1000px">1000px</option>
                    <option value="1100px">1100px</option>
                    <option value="1200px">1200px</option>
                    <option value="1300px">1300px</option>
                    <option value="1400px">1400px</option>
                    <option value="1500px">1500px</option>
                    <option value="1600px">1600px</option>
                    <option value="1700px">1700px</option>
                    <option value="1800px">1800px</option>
                    <option value="1900px">1900px</option>
                    <option value="2000px">2000px</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <span id="fontFamilyName"></span>
            </div>
            <div class="sub-item">
                <select id="fontFamily">
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <span id="fontSizeName"></span>
            </div>
            <div class="sub-item">
                <select id="fontSize">
                    <option value="8px">8px</option>
                    <option value="9px">9px</option>
                    <option value="10px">10px</option>
                    <option value="11px">11px</option>
                    <option value="12px">12px</option>
                    <option value="13px">13px</option>
                    <option value="14px">14px</option>
                    <option value="15px">15px</option>
                    <option value="16px">16px</option>
                    <option value="17px">17px</option>
                    <option value="18px">18px</option>
                    <option value="19px">19px</option>
                    <option value="20px">20px</option>
                    <option value="21px">21px</option>
                    <option value="22px">22px</option>
                    <option value="23px">23px</option>
                    <option value="24px">24px</option>
                    <option value="25px">25px</option>
                    <option value="26px">26px</option>
                    <option value="27px">27px</option>
                    <option value="28px">28px</option>
                    <option value="29px">29px</option>
                    <option value="30px">30px</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">

                <span id="searchWebDesc" class="info-icon" data-tooltip="">&#9432;</span>
            </div>
            <div class="sub-item">
                <select id="searchWeb">
                    <option value="none">none</option>
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line" id="useCGBWrapper">
        <div class="item">
            <div class="sub-item">
                <span id="useCGBName"></span>
                <span id="useCGBDesc" class="info-icon" data-tooltip="">&#9432;</span>
            </div>
            <div class="sub-item">
                <select id="useCGB">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line" id="cspPronounceWrapper">
        <div class="item">
            <div class="sub-item">
                <span id="cspPronounceName"></span>
                <span id="cspPronounceDesc" class="info-icon" data-tooltip="">&#9432;</span>
            </div>
            <div class="sub-item">
                <select id="cspPronounce">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line" id="nowrapWrapper">
        <div class="item">
            <div class="sub-item">
                <span id="nowrapName"></span>
                <span id="nowrapDesc" class="info-icon" data-tooltip="">&#9432;</span>
            </div>
            <div class="sub-item">
                <select id="nowrap">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line" id="selectionIconWrapper">
        <div class="item">
            <div class="sub-item">
                <span id="selectionIconName"></span>
                <span id="selectionIconDesc" class="info-icon" data-tooltip="">&#9432;</span>
            </div>
            <div class="sub-item">
                <select id="selectionIcon">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>
        </div>
    </div>
    <div class="item-wrapper">
        <div class="item">
            <div class="sub-item">
                <div id="keyboardShortcutTitle"></div>
            </div>
            <div class="sub-item">
                <input id="translateHotkey" type="text" size="10" value="" readonly>
            </div>
        </div>
        <div class="italic" style="font-size: smaller">
            <span id="keyboardShortcutDescription"></span>
            <a id="openChromeExtensionsPage" href="#">chrome://extensions/configureCommands</a>
        </div>
    </div>
    <div>
        <h2 id="support" class="section"></h2>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <a id="writeReview" href="" target="_blank"></a>
            </div>
        </div>
    </div>
    <div class="item-wrapper bottom-line">
        <div class="item">
            <div class="sub-item">
                <a id="contactDeveloper" href="" target="_blank"></a>
            </div>
        </div>
    </div>
    <div class="item-wrapper">
        <div class="item">
            <div class="sub-item">
                <a id="patreon" href="https://www.patreon.com/bstasiuk" target="_blank"></a>
            </div>
        </div>
    </div>
    <div style="width: 480px; text-align: center; color: red;">
        <div>
            <p>
                <span id="debug_title"></span> <span id="debug_text"></span>
            </p>
        </div>
    </div>
</body>

</html>
