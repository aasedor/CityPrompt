- type: web
  name: cityprompt-staging-web
  runtime: static
  autoDeployTrigger: 'off'
  buildCommand: npm ci --prefix frontend && python3 scripts/build_hosted_frontend.py
    --fetch-lfs
  staticPublishPath: frontend/dist
  envVars:
  - key: NODE_VERSION
    value: 24.14.0
  - key: PYTHON_VERSION
    value: '3.12'
  - key: GIT_LFS_SKIP_SMUDGE
    value: '1'
  - key: VITE_API_URL
    sync: false
  - key: VITE_GOOGLE_MAPS_API_KEY
    sync: false
  headers:
  - path: /index.html
    name: Cache-Control
    value: no-cache
  - path: /version.json
    name: Cache-Control
    value: no-store
  - path: /sw.js
    name: Cache-Control
    value: no-cache
  - path: /assets/*
    name: Cache-Control
    value: public, max-age=31536000, immutable
  - path: /model-revisions/*
    name: Cache-Control
    value: public, max-age=31536000, immutable
  - path: /reference-images/*
    name: Cache-Control
    value: public, max-age=3600
  - path: /archetypes/*
    name: Cache-Control
    value: public, max-age=3600
  - path: /policy-maps/*
    name: Cache-Control
    value: public, max-age=3600
  routes:
  - type: rewrite
    source: /login
    destination: /index.html
  - type: rewrite
    source: /register
    destination: /index.html
  - type: rewrite
    source: /oauth/callback
    destination: /index.html
  - type: rewrite
    source: /forgot-password
    destination: /index.html
  - type: rewrite
    source: /reset-password
    destination: /index.html
  - type: rewrite
    source: /projects
    destination: /index.html
  - type: rewrite
    source: /projects/*
    destination: /index.html
  - type: rewrite
    source: /settings/*
    destination: /index.html
  - type: rewrite
    source: /admin
    destination: /index.html
  - type: rewrite
    source: /admin/*
    destination: /index.html
  - type: rewrite
    source: /shared/*
    destination: /index.html
  - type: rewrite
    source: /invite/*
    destination: /index.html
