# Opt-in full-catalogue staging. See docs/RENDER_RELEASE_2026-10-07.md.
# Creates paid resources only when applied in Render; does not claim catalogue approval.
# Use this custom Blueprint path; do not sync the legacy render.yaml for this release.
databases:
- name: cityprompt-staging-db
  region: oregon
  plan: 0.5c-1g
  postgresMajorVersion: '16'
  databaseName: cityprompt_staging
  diskSizeGB: 15
  ipAllowList: []
services:
- type: keyvalue
  name: cityprompt-staging-queue
  region: oregon
  plan: 256mb
  maxmemoryPolicy: noeviction
  ipAllowList: []
- type: web
  name: cityprompt-staging-api
  runtime: docker
  region: oregon
  dockerfilePath: ./backend/Dockerfile.render
  dockerContext: .
  autoDeployTrigger: 'off'
  plan: 1c-2g
  preDeployCommand: python -m scripts.prepare_database
  dockerCommand: bash scripts/start.sh
  healthCheckPath: /health
  envVars:
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: 'false'
  - key: CLASSROOM_RELEASE
    value: 'false'
  - key: RUN_DATABASE_MIGRATIONS
    value: 'false'
  - key: COMFY_TRIALS_ENABLED
    value: 'false'
  - key: DIRECT_3D_JOBS_ENABLED
    value: 'true'
  - key: DIRECT_3D_IMAGES_ENABLED
    value: 'true'
  - key: DIRECT_3D_QUEUE_LIMIT
    value: '16'
  - key: DIRECT_3D_PROJECT_QUEUE_LIMIT
    value: '2'
  - key: KLING_ANIMATION_ENABLED
    value: 'true'
  - key: LOG_LEVEL
    value: INFO
  - key: DATABASE_URL
    fromDatabase:
      name: cityprompt-staging-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      name: cityprompt-staging-queue
      type: keyvalue
      property: connectionString
  - key: JWT_SECRET_KEY
    generateValue: true
  - key: ALLOWED_ORIGINS
    sync: false
  - key: FRONTEND_URL
    sync: false
  - key: S3_ENDPOINT_URL
    sync: false
  - key: S3_REGION
    sync: false
  - key: S3_BUCKET_NAME
    sync: false
  - key: S3_ACCESS_KEY
    sync: false
  - key: S3_SECRET_KEY
    sync: false
  - key: OPENAI_API_KEY
    sync: false
  - key: FAL_KEY
    sync: false
  - key: RENDER_GLOBAL_DAILY_TOKEN_CAP
    sync: false
  - key: GIT_LFS_SKIP_SMUDGE
    value: '1'
- type: worker
  name: cityprompt-staging-images
