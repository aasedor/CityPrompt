# Render Blueprint — 3D Development Platform
# https://render.com/docs/blueprint-spec

databases:
  - name: 3d-platform-db
    plan: basic-256mb
    databaseName: dev_platform
    postgresMajorVersion: "16"
    ipAllowList: []  # only internal access

services:
  # --- PostgreSQL PostGIS extensions are enabled via start.sh ---

  # --- Redis ---
  - type: redis
    name: 3d-platform-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # --- Backend API ---
  - type: web
    name: 3d-platform-api
    runtime: docker
    plan: standard
    dockerfilePath: ./infrastructure/docker/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 3d-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: 3d-platform-redis
          type: redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://3d-platform-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://3d-platform-frontend.onrender.com
      - key: S3_BUCKET_NAME
        value: 3d-platform-uploads
      - key: S3_REGION
        value: auto
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set these manually in Render dashboard:
      # S3_ENDPOINT_URL, S3_ACCESS_KEY, S3_SECRET_KEY
      # ANTHROPIC_API_KEY, MAPBOX_ACCESS_TOKEN, MESHY_API_KEY

  # --- Celery Worker ---
  - type: worker
    name: 3d-platform-worker
    runtime: docker
    plan: standard
    dockerfilePath: ./infrastructure/docker/Dockerfile.render
    dockerContext: ./backend
    dockerCommand: celery -A app.tasks.worker:celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 3d-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: 3d-platform-redis
          type: redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: S3_BUCKET_NAME
        value: 3d-platform-uploads
      - key: S3_REGION
        value: auto
      # Set these manually in Render dashboard:
      # S3_ENDPOINT_URL, S3_ACCESS_KEY, S3_SECRET_KEY
      # ANTHROPIC_API_KEY, MAPBOX_ACCESS_TOKEN, MESHY_API_KEY

  # --- Frontend Static Site ---
  - type: web
    name: 3d-platform-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://3d-platform-api.onrender.com
      - key: VITE_WS_URL
        value: wss://3d-platform-api.onrender.com
      # Set manually in Render dashboard:
      # VITE_MAPBOX_TOKEN
