server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Asset-ticket query strings are credentials; do not write them to access logs.
    access_log off;
    client_max_body_size 128m;

    # Preserve API file authorization/proxying before extension-based static rules.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location = /ready { proxy_pass http://api:8000/ready; }
    location = /health { proxy_pass http://api:8000/health; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location ~* \.(?:glb|gltf|png|jpe?g|webp|svg|json|js|css|woff2?|ico|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / { try_files $uri /index.html; }
}
