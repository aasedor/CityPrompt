<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/city-prompt-logo.png" />
    <link rel="apple-touch-icon" href="/images/city-prompt-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001668" />
    <meta name="description" content="Design site plans, generate AI-powered 3D buildings, and explore immersive architectural visualizations" />
    <link rel="manifest" href="/manifest.json" />
    <title>City Prompt</title>
  </head>
  <body>
    <!-- TEMP (park ortho pilot 2026-07-11): background-pane shims for in-app
         browser e2e. rAF + ResizeObserver are frame-aligned and frozen in a
         hidden pane, so r3f canvases never size/render. Gated on ?paneShim=1;
         remove after pilot. -->
    <script>
      if (new URLSearchParams(location.search).has('paneShim')) {
        // MessageChannel pump: hidden tabs floor timers to 1 Hz, but
        // MessageChannel tasks are NOT throttled (~40fps achievable).
        const rafQueue = new Map();
        let rafId = 0;
        let pumping = false;
        const chan = new MessageChannel();
        let lastTick = 0;
        chan.port1.onmessage = () => {
          const now = performance.now();
          // pace to ~25fps so we don't spin the CPU
          if (now - lastTick < 40) { chan.port2.postMessage(0); return; }
          lastTick = now;
          const cbs = [...rafQueue.values()];
          rafQueue.clear();
          for (const cb of cbs) { try { cb(now); } catch (e) { console.error(e); } }
          if (rafQueue.size > 0 || cbs.length > 0) chan.port2.postMessage(0);
          else pumping = false;
        };
        window.requestAnimationFrame = (cb) => {
          rafQueue.set(++rafId, cb);
          if (!pumping) { pumping = true; chan.port2.postMessage(0); }
          return rafId;
        };
        window.cancelAnimationFrame = (id) => { rafQueue.delete(id); };
        window.ResizeObserver = class {
          constructor(cb) {
            this._cb = cb;
            this._els = new Set();
            this._last = new Map();
            const poll = () => {
              const entries = [];
              for (const el of this._els) {
                const r = el.getBoundingClientRect();
                const prev = this._last.get(el);
                if (!prev || prev.width !== r.width || prev.height !== r.height) {
                  this._last.set(el, r);
                  entries.push({ target: el, contentRect: r });
                }
              }
              if (entries.length) this._cb(entries, this);
              this._raf = window.requestAnimationFrame(poll);
            };
            this._raf = window.requestAnimationFrame(poll);
          }
          observe(el) { this._els.add(el); }
          unobserve(el) { this._els.delete(el); this._last.delete(el); }
          disconnect() { this._els.clear(); this._last.clear(); window.cancelAnimationFrame(this._raf); }
        };
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
        Object.defineProperty(document, 'hidden', { get: () => false });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
