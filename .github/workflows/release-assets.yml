name: Release Assets

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to verify
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  hydrated-runtime-assets:
    name: hydrated-runtime-assets
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Reclaim runner space for release assets
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Initialize Git LFS
        run: git lfs install --local

      - name: Fetch manifest-required LFS objects
        shell: bash
        run: |
          required_paths="$RUNNER_TEMP/cityprompt-required-lfs-paths.txt"
          node frontend/scripts/generate-runtime-asset-manifest.mjs \
            --list-required-lfs-paths > "$required_paths"

          mapfile -t paths < "$required_paths"
          echo "Hydrating ${#paths[@]} manifest-required LFS paths."
          if (( ${#paths[@]} == 0 )); then
            exit 0
          fi

          batch_size=75
          for ((offset = 0; offset < ${#paths[@]}; offset += batch_size)); do
            batch=("${paths[@]:offset:batch_size}")
            include=$(IFS=,; echo "${batch[*]}")
            git lfs pull --include="$include" --exclude=""
          done

      - name: Verify hydrated runtime asset manifest
        run: node frontend/scripts/generate-runtime-asset-manifest.mjs --check --require-hydrated

      - name: Report release asset footprint
        run: |
          du -sh frontend/public .git/lfs
          df -h /
