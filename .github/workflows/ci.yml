name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------
  # Backend: lint, type-check, test
  # -------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check --line-length=120 .

      - name: Type check with mypy
        # This is an intentionally expanding boundary. The legacy API,
        # processing, and rendering modules are tracked separately until their
        # historical typing backlog is removed.
        run: mypy app/core app/models app/schemas --ignore-missing-imports --no-error-summary

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/test_db
          DATABASE_URL_SYNC: postgresql://testuser:testpass@localhost:5432/test_db
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/test_db
          DATABASE_URL_SYNC: postgresql://testuser:testpass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          ANTHROPIC_API_KEY: test-key
        run: pytest tests/ -v --tb=short

  # -------------------------------------------------------
  # Frontend: lint, type-check, test
  # -------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Reject unreachable files and dependency drift
        run: npm run check:dead-code

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Build production bundle
        run: npm run build

      - name: Validate archetype assets
        run: npm run check:archetype-assets

      - name: Validate Sticker Method assets
        run: npm run check:sticker-pilot-assets

      - name: Validate hydrated runtime asset manifest
        run: npm run check:runtime-assets:hydrated

      - name: Enforce bundle budget
        run: npm run check-budget

  # -------------------------------------------------------
  # Browser: current student-facing auth/project/3D workflow
  # -------------------------------------------------------
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run functional browser workflow
        run: npm run test:e2e

  # -------------------------------------------------------
  # Docker build verification
  # -------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build backend image
        run: docker build -f infrastructure/docker/Dockerfile.backend -t backend-test ./backend

      - name: Build frontend image
        run: docker build -f infrastructure/docker/Dockerfile.frontend -t frontend-test ./frontend
