<!doctype html><html><head><meta charset="utf-8"><title>CityPrompt · People model review</title><style>
body{margin:0;background:#e7efec;color:#142b32;font:15px system-ui}header{padding:15px 24px;background:#fff9ed;border-bottom:2px solid #142b32}button,select{padding:9px;margin:5px;border:2px solid;border-radius:12px;font:inherit}button{background:#caff37;font-weight:700}canvas{display:block;margin:auto}#report{white-space:pre-wrap;font:12px monospace;padding:12px}#status{padding:8px}button:disabled{opacity:.5}
</style></head><body><header><b>CityPrompt · actual People models / local QA</b><p>0.5 m grid · fixed models keep their authored aids and pose · standalone renderer measurements, not student-device certification.</p><button id="inclusive">Eight inclusive roles</button><button id="80">Measure 80 fixed people/groups</button><button id="160">Measure 160 fixed people/groups</button><select id="character" aria-label="People model"></select><select id="action" aria-label="Model action"><option>standing</option><option>walking</option><option>running</option><option>sitting</option><option>waving</option></select><button id="actor">View selected animated person</button><button id="all">Check every model</button><button id="capture">Download model screenshot</button><div id="status">Loading catalogue…</div></header><div id="viewport"></div><pre id="report"></pre><script type="module">
import * as T from '/@fs/C:/Users/andre/.codex/worktrees/add-details-recovery/CityPrompt/artifacts/vite-cache/deps/three.js';
import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
import {buildDetailInstances,disposeDetailInstances} from '/src/features/parks/detailInstances.ts';
import {createPeopleActor} from '/src/features/people/peopleAnimation.ts';
import {createPeopleActionPose} from '/src/features/people/peoplePose.ts';
import oldRows from '/src/features/people/peopleCatalogue.json?import';
import inclusiveRows from '/src/features/people/inclusivePeopleCatalogue.json?import';
const rows=[...oldRows,...inclusiveRows],select=document.querySelector('#character'),status=document.querySelector('#status'),report=document.querySelector('#report');
select.innerHTML=rows.map(r=>`<option value="${r.id}">${r.label}</option>`).join('');
const scene=new T.Scene();scene.background=new T.Color('#d0e2ea');const camera=new T.PerspectiveCamera(36,1280/720,.05,500);camera.position.set(4,3,10);camera.lookAt(0,.8,0);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,720);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;document.querySelector('#viewport').append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.update();scene.add(new T.HemisphereLight(0xffffff,0x64716d,2.5));const sun=new T.DirectionalLight(0xffffff,2.4);sun.position.set(5,10,8);scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(120,120),new T.MeshStandardMaterial({color:'#bac5be',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.003;scene.add(floor);const grid=new T.GridHelper(100,200,0x738a7f,0xa2b4a8);grid.position.y=-.002;scene.add(grid);
const loader=new GLTFLoader(),cache=new Map();let groups=[],actor=null,pose=null,animate=false,measuring=false,clock=0;
async function model(row){if(!cache.has(row.id))cache.set(row.id,await loader.loadAsync(row.url));return cache.get(row.id);}
function clear(){groups.forEach(g=>{scene.remove(g);disposeDetailInstances(g)});groups=[];if(actor){scene.remove(actor.root);actor.dispose();actor=null;pose=null;}animate=false;}
function fit(distance=10,targetZ=0){camera.position.set(distance*.26,distance*.23,distance);controls.target.set(0,.8,targetZ);controls.update();}
async function inclusive(count=8){clear();if(inclusiveRows.length!==8)throw Error('Eight reviewed inclusive entries are not registered yet');const cols=count===8?4:count===80?10:16;const byId=new Map();for(let i=0;i<count;i++){const row=inclusiveRows[i%8],matrix=new T.Matrix4().makeTranslation((i%cols-(cols-1)/2)*1.9,0,(Math.floor(i/cols)-(Math.ceil(count/cols)-1)/2)*2);const a=byId.get(row.id)??[];a.push(matrix);byId.set(row.id,a);}for(const row of inclusiveRows){const gltf=await model(row),group=buildDetailInstances(gltf.scene,byId.get(row.id),true);group.userData.projectDetailIds=byId.get(row.id).map((_,i)=>row.id+':'+i);groups.push(group);scene.add(group);}fit(count===8?15:count===80?34:51);renderer.render(scene,camera);status.textContent=`${count} fixed models/groups · ${renderer.info.render.triangles} triangles · ${renderer.info.render.calls} draw calls`;}
async function measure(count){const start=performance.now();await inclusive(count);const loadBuildMs=performance.now()-start;measuring=true;for(let i=0;i<10;i++)renderer.render(scene,camera);const cpu=[],frames=[];let previous=0;for(let i=0;i<120;i++){const now=await new Promise(requestAnimationFrame);if(previous)frames.push(now-previous);previous=now;const t=performance.now();renderer.render(scene,camera);cpu.push(performance.now()-t);}const percentile=(a,p)=>a.sort((x,y)=>x-y)[Math.floor((a.length-1)*p)];const result={count,renderer:'1280×720 DPR1 antialias, desktop Edge; isolated scene; cached assets on repeat',loadBuildMs,triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls,geometryCount:renderer.info.memory.geometries,textures:renderer.info.memory.textures,cpuRenderMedianMs:percentile(cpu,.5),cpuRenderP95Ms:percentile(cpu,.95),frameMedianMs:percentile(frames,.5),frameP95Ms:percentile(frames,.95),gpuTime:'Not measured',samples:120};measuring=false;report.textContent=JSON.stringify(result,null,2);status.textContent='Measurement complete';}
async function selected(){clear();const row=rows.find(r=>r.id===select.value),gltf=await model(row);if(row.people){actor=createPeopleActor(gltf.scene,gltf.animations,row.people);pose=createPeopleActionPose(actor);pose.sample(document.querySelector('#action').value,0,false);scene.add(actor.root);animate=true;clock=performance.now();}else{const group=buildDetailInstances(gltf.scene,[new T.Matrix4()],true);groups.push(group);scene.add(group);}fit(4);status.textContent=row.label;}
document.querySelector('#inclusive').onclick=()=>inclusive().catch(error=>status.textContent=error.stack);for(const n of [80,160])document.getElementById(String(n)).onclick=()=>measure(n).catch(error=>status.textContent=error.stack);document.querySelector('#actor').onclick=()=>selected().catch(error=>status.textContent=error.stack);
document.querySelector('#all').onclick=async()=>{try{const checks=[];for(const row of rows){select.value=row.id;await selected();renderer.render(scene,camera);await new Promise(requestAnimationFrame);const gltf=await model(row);const box=new T.Box3().setFromObject(gltf.scene,true);let triangles=0;gltf.scene.traverse(o=>{if(o.isMesh)triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3});checks.push({id:row.id,animations:gltf.animations.map(c=>c.name),boundsMin:[...box.min],boundsMax:[...box.max],triangles});}report.textContent=JSON.stringify(checks,null,2);status.textContent=`${checks.length} GLBs decoded and drawn in the browser; pixels and actions require visual review`;}catch(error){status.textContent=error.stack;}};
document.querySelector('#capture').onclick=()=>{renderer.render(scene,camera);const link=document.createElement('a');link.href=renderer.domElement.toDataURL('image/png');link.download='cityprompt-people-model-qa.png';link.click();};
function tick(now){if(measuring){requestAnimationFrame(tick);return;}if(animate&&pose)pose.sample(document.querySelector('#action').value,(now-clock)/1000,false);renderer.render(scene,camera);requestAnimationFrame(tick);}requestAnimationFrame(tick);status.textContent=`${rows.length} current models; choose a test.`;
</script></body></html>
